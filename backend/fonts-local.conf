<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- PPT 변환 시 없는 폰트가 글리프 없는 DejaVu 로 빠지는 것을 방지.
       원본 폰트를 메트릭이 가까운 무료 폰트로 강제 매핑한다. -->

  <!-- 맑은고딕(한글) → Noto Sans CJK KR -->
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK KR</string></edit>
  </match>

  <!-- Arial → Liberation Sans (Arial 과 자폭 호환 설계) -->
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>

  <!-- Times New Roman → Liberation Serif -->
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>

  <!-- 한글 기본 fallback 도 Noto CJK 우선 -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append"><string>Noto Sans CJK KR</string></edit>
  </match>
</fontconfig>
